<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のランダムチャレンジ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f5f7;
      color: #202124;
    }

    .app {
      width: min(92vw, 600px);
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      color: #6b7280;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
    }

    .challenge {
      min-height: 130px;
      display: grid;
      place-items: center;
      padding: 24px;
      margin-bottom: 24px;
      border-radius: 18px;
      background: #f8fafc;
      font-size: 1.25rem;
      line-height: 1.7;
      font-weight: 700;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .status {
      min-height: 1.5em;
      margin: 24px 0 8px;
      color: #4b5563;
    }

    .count {
      margin: 0;
      font-weight: 700;
    }

    .notice {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <p class="eyebrow">TODAY'S CHALLENGE</p>
      <h1>今日のチャレンジ</h1>

      <div id="challenge" class="challenge">
        今日のチャレンジを決めよう！
      </div>

      <div class="buttons">
        <button id="drawButton" class="primary">今日のチャレンジを決める</button>
        <button id="completeButton" class="secondary" disabled>達成！</button>
      </div>

      <p id="status" class="status">1日に1つだけチャレンジできます。</p>
      <p id="count" class="count">今日の達成数：0</p>
      <p class="notice">※ チャレンジはブラウザに保存されます。</p>
    </section>
  </main>

  <script>
const STORAGE_KEY = "todaysRandomChallenge";

const challengeElement = document.getElementById("challenge");
const drawButton = document.getElementById("drawButton");
const completeButton = document.getElementById("completeButton");
const statusElement = document.getElementById("status");
const countElement = document.getElementById("count");

let challenges = [];
let currentData = null;

function setBackgroundByDay() {
  const colors = [
    "#ffe5e5",
    "#fff4cc",
    "#e5f6ff",
    "#e8ffe5",
    "#f3e5ff",
    "#ffe8d6",
    "#e5e5ff"
  ];

  document.body.style.backgroundColor =
    colors[new Date().getDay()];
}

function getToday() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

async function loadChallenges() {
  const response = await fetch("challenges.json");

  if (!response.ok) {
    throw new Error("challenges.jsonの読み込み失敗");
  }

  const data = await response.json();

  if (!Array.isArray(data) || data.length === 0) {
    throw new Error("challenges.jsonが空です");
  }

  challenges = data;
}

function saveToday() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(currentData)
  );
}

function showTodayChallenge() {
  challengeElement.textContent =
    currentData.challenge;

  drawButton.disabled = true;

  if (currentData.completed) {
    statusElement.textContent =
      "今日のチャレンジは達成済みです。";

    completeButton.disabled = true;
    countElement.textContent = "今日の達成数：1";
  } else {
    statusElement.textContent =
      "今日はこのチャレンジに挑戦しましょう。";

    completeButton.disabled = false;
    countElement.textContent = "今日の達成数：0";
  }
}

function loadToday() {
  const saved =
    localStorage.getItem(STORAGE_KEY);

  if (!saved) {
    return;
  }

  try {
    const data = JSON.parse(saved);

    if (data.date !== getToday()) {
      localStorage.removeItem(STORAGE_KEY);
      return;
    }

    if (!data.challenge) {
      localStorage.removeItem(STORAGE_KEY);
      return;
    }

    currentData = data;
    showTodayChallenge();

  } catch {
    localStorage.removeItem(STORAGE_KEY);
  }
}

drawButton.addEventListener("click", () => {
  if (currentData) {
    return;
  }

  const randomIndex =
    Math.floor(Math.random() * challenges.length);

  currentData = {
    date: getToday(),
    challenge: challenges[randomIndex],
    completed: false
  };

  saveToday();
  showTodayChallenge();
});

completeButton.addEventListener("click", () => {
  if (!currentData || currentData.completed) {
    return;
  }

  currentData.completed = true;

  saveToday();
  showTodayChallenge();
});

async function init() {
  try {
    setBackgroundByDay();

    await loadChallenges();

    loadToday();
  } catch (error) {
    console.error(error);

    statusElement.textContent =
      "チャレンジデータの読み込みに失敗しました。";
  }
}

init();
</script>
</body>
</html>
