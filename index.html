<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のランダムチャレンジ</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  font-family:sans-serif;
}

.app{
  width:min(90vw,600px);
}

.card{
  background:white;
  padding:32px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.challenge{
  min-height:120px;
  margin:20px 0;
  padding:20px;
  background:#f1f5f9;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:1.2rem;
  font-weight:bold;
}

button{
  padding:12px 20px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

button:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

.primary{
  background:#111827;
  color:white;
}

.secondary{
  background:#d1d5db;
}

.completed-card{
  background:#dcfce7;
}

.completed-challenge{
  background:#bbf7d0;
  color:#166534;
}

.status{
  margin-top:20px;
}

</style>
</head>

<body>

<div class="app">

<div class="card" id="card">

<h1>今日のチャレンジ</h1>

<div id="challenge" class="challenge">
今日のチャレンジを決めよう！
</div>

<button id="drawButton" class="primary">
今日のチャレンジを決める
</button>

<button id="completeButton" class="secondary" disabled>
達成！
</button>

<a href="history.html">
<button type="button">
今週の達成状況
</button>
</a>

<p id="status" class="status">
1日に1つだけチャレンジできます。
</p>

<p id="count">

</p>

</div>

</div>

<script>

const STORAGE_KEY = "todaysRandomChallenge";
const HISTORY_KEY = "challengeHistory";

let challenges = [];
let currentData = null;

const challengeElement =
document.getElementById("challenge");

const drawButton =
document.getElementById("drawButton");

const completeButton =
document.getElementById("completeButton");

const statusElement =
document.getElementById("status");

const countElement =
document.getElementById("count");

function setBackgroundByDay(){

  const colors = [
    "#ffe5e5",
    "#fff4cc",
    "#e5f6ff",
    "#e8ffe5",
    "#f3e5ff",
    "#ffe8d6",
    "#e5e5ff"
  ];

  document.body.style.backgroundColor =
    colors[new Date().getDay()];
}

function getToday(){
  return new Date().toISOString().split("T")[0];
}

async function loadChallenges(){

  const response =
    await fetch("challenges.json");

  challenges =
    await response.json();

}

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(currentData)
  );

}

function saveHistory(){

  let history = JSON.parse(
    localStorage.getItem(HISTORY_KEY) || "[]"
  );

  history.push({
    date:currentData.date,
    challenge:currentData.challenge
  });

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );
}

function displayChallenge(){

  challengeElement.textContent =
    currentData.challenge;

  drawButton.disabled = true;

  if(currentData.completed){

    completeButton.disabled = true;

    challengeElement.textContent =
      "チャレンジ達成！";

    statusElement.textContent =
      "今日のチャレンジは達成済みです。";

    document
      .getElementById("card")
      .classList.add("completed-card");

    challengeElement
      .classList.add("completed-challenge");

  }else{

    completeButton.disabled = false;

    statusElement.textContent =
      "今日はこのチャレンジに挑戦しましょう。";
  }
}

function loadToday(){

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if(!saved){
    return;
  }

  try{

    const data =
      JSON.parse(saved);

    if(data.date !== getToday()){

      localStorage.removeItem(
        STORAGE_KEY
      );

      return;
    }

    currentData = data;

    displayChallenge();

  }catch{

    localStorage.removeItem(
      STORAGE_KEY
    );
  }
}

drawButton.addEventListener("click",()=>{

  const randomIndex =
    Math.floor(
      Math.random() * challenges.length
    );

  currentData = {
    date:getToday(),
    challenge:challenges[randomIndex],
    completed:false
  };

  saveData();
  displayChallenge();

});

completeButton.addEventListener("click",()=>{

  if(!currentData){
    return;
  }

  if(currentData.completed){
    return;
  }

  currentData.completed = true;

  saveData();
  saveHistory();

  displayChallenge();

});

async function init(){

  setBackgroundByDay();

  await loadChallenges();

  loadToday();
}

init();

</script>

</body>
</html>
