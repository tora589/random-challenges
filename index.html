<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のランダムチャレンジ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI",sans-serif;
  background:#f5f7fa;
}

.header{
  height:80px;
  background:#59a9d8;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2rem;
  font-weight:700;
}

.app{
  max-width:700px;
  margin:auto;
  padding:30px;
}

.card{
  background:white;
  border-radius:30px;
  padding:40px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.08);
}

.progress-circle{
  width:300px;
  height:300px;
  border-radius:50%;
  border:20px solid #d9eaf4;
  margin:0 auto 30px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.progress-title{
  font-size:2rem;
  font-weight:700;
  margin-bottom:15px;
}

.progress-count{
  font-size:1.8rem;
  color:#555;
}

.challenge{
  margin-top:20px;
  font-size:1.5rem;
  min-height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.primary{
  background:#59a9d8;
  color:white;
  border:none;
  border-radius:16px;
  padding:16px 24px;
  font-size:1rem;
  cursor:pointer;
}

.secondary{
  background:#66d18f;
  color:white;
  border:none;
  border-radius:16px;
  padding:16px 24px;
  font-size:1rem;
  cursor:pointer;
}

button{
  margin:8px;
}

.message{
  margin-top:30px;
  font-size:1.2rem;
  color:#444;
}

.completed-card{
  background:#ecfff2;
}

.completed-challenge{
  color:#16a34a;
  font-weight:700;
}

.nav{
  margin-top:40px;
  display:flex;
  justify-content:center;
  gap:20px;
}

</style>
</head>

<body>

<div class="header">
  challenge
</div> 

<div class="app">

<div class="card" id="card">

<h1>今日のチャレンジ</h1>

<div id="challenge" class="challenge">
今日のチャレンジを決めよう！
</div>

<button id="drawButton" class="primary">
今日のチャレンジを決める
</button>

<button id="completeButton" class="secondary" disabled>
達成！
</button>

<a href="history.html">
<button type="button">
今週の達成状況
</button>
</a>

<p id="status" class="status">
1日に1つだけチャレンジできます。
</p>

<p id="count">
今日の達成数：0
</p>

</div>

</div>

<script>

const STORAGE_KEY = "todaysRandomChallenge";
const HISTORY_KEY = "challengeHistory";

let challenges = [];
let currentData = null;

const challengeElement =
document.getElementById("challenge");

const drawButton =
document.getElementById("drawButton");

const completeButton =
document.getElementById("completeButton");

const statusElement =
document.getElementById("status");

const countElement =
document.getElementById("count");

function setBackgroundByDay(){

  const colors = [
    "#ffe5e5",
    "#fff4cc",
    "#e5f6ff",
    "#e8ffe5",
    "#f3e5ff",
    "#ffe8d6",
    "#e5e5ff"
  ];

  document.body.style.backgroundColor =
    colors[new Date().getDay()];
}

function getToday(){
  return new Date().toISOString().split("T")[0];
}

async function loadChallenges(){

  const response =
    await fetch("challenges.json");

  challenges =
    await response.json();

}

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(currentData)
  );

}

function saveHistory(){

  let history = JSON.parse(
    localStorage.getItem(HISTORY_KEY) || "[]"
  );

  history.push({
    date:currentData.date,
    challenge:currentData.challenge
  });

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );
}

function displayChallenge(){

  challengeElement.textContent =
    currentData.challenge;

  drawButton.disabled = true;

  if(currentData.completed){

    completeButton.disabled = true;

    challengeElement.textContent =
      "チャレンジ達成！";

    statusElement.textContent =
      "今日のチャレンジは達成済みです。";


    document
      .getElementById("card")
      .classList.add("completed-card");

    challengeElement
      .classList.add("completed-challenge");

  }else{

    completeButton.disabled = false;

    statusElement.textContent =
      "今日はこのチャレンジに挑戦しましょう。";
  }
}

function loadToday(){

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if(!saved){
    return;
  }

  try{

    const data =
      JSON.parse(saved);

    if(data.date !== getToday()){

      localStorage.removeItem(
        STORAGE_KEY
      );

      return;
    }

    currentData = data;

    displayChallenge();

  }catch{

    localStorage.removeItem(
      STORAGE_KEY
    );
  }
}

drawButton.addEventListener("click",()=>{

  const randomIndex =
    Math.floor(
      Math.random() * challenges.length
    );

  currentData = {
    date:getToday(),
    challenge:challenges[randomIndex],
    completed:false
  };

  saveData();
  displayChallenge();

});

completeButton.addEventListener("click",()=>{

  if(!currentData){
    return;
  }

  if(currentData.completed){
    return;
  }

  currentData.completed = true;

  saveData();
  saveHistory();

  displayChallenge();

});

async function init(){

  setBackgroundByDay();

  await loadChallenges();

  loadToday();
}

init();

</script>

</body>
</html>
