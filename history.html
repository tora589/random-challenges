<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>今週の達成状況</title>

<style>

body{
  font-family:sans-serif;
  max-width:800px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
}

.item{
  background:#dcfce7;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

.back{
  display:inline-block;
  margin-top:20px;
}

</style>
</head>

<body>

<h1>今週の達成状況</h1>

<div id="history"></div>

<a class="back" href="index.html">
← 戻る
</a>

<script>

const historyElement =
document.getElementById("history");

const history =
JSON.parse(
  localStorage.getItem(
    "challengeHistory"
  ) || "[]"
);

const oneWeekAgo =
new Date();

oneWeekAgo.setDate(
  oneWeekAgo.getDate() - 7
);

const weeklyHistory =
history.filter(item => {

  return new Date(item.date)
  >= oneWeekAgo;

});

if(weeklyHistory.length === 0){

  historyElement.innerHTML =
    "<p>達成履歴がありません。</p>";

}else{

  weeklyHistory.forEach(item => {

    historyElement.innerHTML += `
      <div class="item">
        <strong>${item.date}</strong><br>
        ${item.challenge}
      </div>
    `;

  });

}

</script>

</body>
</html>
